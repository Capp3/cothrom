volumes:
  project_pgdata:
  project_opdata:

x-op-restart-policy: &restart_policy
  restart: unless-stopped
x-op-image: &image
  image: openproject/openproject:${TAG:-16-slim}
x-op-app: &app
  <<: [*image, *restart_policy]
  environment:
    OPENPROJECT_HTTPS: true
    OPENPROJECT_HOST__NAME: project.${DOMAIN}
    OPENPROJECT_HSTS: true
    RAILS_CACHE_STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}"
    DATABASE_URL: "${DATABASE_URL:-postgres://postgres:p4ssw0rd@project_db:5432/openproject?pool=20&encoding=unicode&reconnect=true}"
    RAILS_MIN_THREADS: ${RAILS_MIN_THREADS:-4}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
    # set to true to enable the email receiving feature. See ./docker/cron for more options
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
  volumes:
    - "project_opdata:/var/openproject/assets"
    - ${BACKUP_DIR}/project:/backup

services:
  project_db:
    image: postgres:17-bookworm
    <<: *restart_policy
    stop_grace_period: "3s"
    container_name: project_db
    volumes:
      - "project_pgdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p4ssw0rd}
      POSTGRES_DB: openproject
    networks:
      - database

  cache:
    image: memcached
    <<: *restart_policy
    container_name: project_cache
    networks:
      - database

  project_proxy:
    build:
      context: ./docker/build/openproject/proxy
      args:
        APP_HOST: web
    image: openproject/proxy
    <<: *restart_policy
    ports:
      - ${PROJECT_PORT}:80
    depends_on:
      - web
    networks:
      - frontend

  project_web:
    <<: *app
    command: "./docker/prod/web"
    container_name: project_web
    networks:
      - frontend
      - backend
      - database
    depends_on:
      - project_db
      - project_cache
      - project_seeder
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}/health_checks/default"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  project_autoheal:
    image: willfarrell/autoheal:1.2.0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 600
      AUTOHEAL_INTERVAL: 30

  project_worker:
    <<: *app
    command: "./docker/prod/worker"
    container_name: project_worker
    networks:
      - backend
      - database
    depends_on:
      - project_db
      - cache
      - project_seeder

  project_cron:
    <<: *app
    command: "./docker/prod/cron"
    container_name: project_cron
    networks:
      - backend
    depends_on:
      - project_db
      - cache
      - project_seeder

  project_seeder:
    <<: *app
    command: "./docker/prod/seeder"
    container_name: project_seeder
    restart: on-failure
    networks:
      - backend
      - database
