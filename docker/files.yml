services:
  projectsend:
    image: lscr.io/linuxserver/projectsend:latest
    container_name: files_projectsend
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - files_config:/config
      - ${DATA_DIR}/files:/data
      - ${BACKUP_DIR}/files:/backup
    ports:
      - ${FILES_PORT}:80
    restart: unless-stopped
    networks:
      - frontend

  files_db:
    container_name: files_db
    environment:
      POSTGRES_DB: files
      POSTGRES_PASSWORD: ${FILES_POSTGRES_PASSWORD}
      POSTGRES_USER: files
    healthcheck:
      interval: 10s
      retries: 10
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"files\""]
      timeout: 2s
    image: postgres:17-bookworm
    restart: always
    volumes:
      - files_db:/var/lib/postgresql/data
    networks:
      - database

volumes:
  files_config:
  files_db: