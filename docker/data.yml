services:
  data_nocodb:
    depends_on:
      data_nocodb_db:
        condition: service_healthy
    environment:
      NC_DB: 'pg://data_nocodb_db:5432?u=postgres&p=password&d=data_nocodb_db'
    image: 'nocodb/nocodb:latest'
    container_name: data_nocodb
    ports:
      - ${DATA_PORT}:8080
    restart: always
    volumes:
      - data_nocodb:/usr/app/data
      - ${BACKUP_DIR}/data/nocodb:/backup
    networks:
      - database
      - frontend

  data_nocodb_db:
    container_name: data_nocodb_db
    environment:
      POSTGRES_DB: data_nocodb_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "nocodb_db"']
      timeout: 2s
    image: postgres:17-bookworm
    restart: always
    volumes:
      - data_nocodb_db:/var/lib/postgresql/data
    networks:
      - database

  nocodb_data:
    container_name: data_nocodb_data
    environment:
      POSTGRES_DB: nocodb_data
      POSTGRES_PASSWORD: ${DATA_DATA_NOCODB_POSTGRES_PASSWORD}
      POSTGRES_USER: ${DATA_DATA_NOCODB_POSTGRES_USER}
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "nocodb_data"']
      timeout: 2s
    image: postgres:17-bookworm
    restart: always
    volumes:
      - data_nocodb_data:/var/lib/postgresql/data
    networks:
      - database

  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: data_rss-bridge
    volumes:
      - ./config:/config
    ports:
      - ${DATA_RSS_BRIDGE_PORT}:80
    restart: unless-stopped
    networks:
      - backend
      - database

