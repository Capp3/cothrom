services:
  dashy:
    image: lissy93/dashy
    container_name: home_dashy
    volumes:
      - ../config/home/:/app/user-data/
    ports:
      - ${HOME_PORT}:8080
    environment:
      - NODE_ENV=production
      - UID=${PUID}
      - GID=${PGID}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '/app/services/healthcheck']
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend
    labels:
      - io.cothrom.role="app"
      - io.cothrom.stack="home"
      - io.cothrom.data="false"
      - io.cothrom.backup.policy="weekly"

volumes:
  dashy_data:
